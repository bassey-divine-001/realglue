name: Android Build

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace --info --console=plain 2>&1 | tee gradle-build.log
        shell: bash
        working-directory: GLOO WALL TAPPER APP

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GlooWallMacro-Build-Log
          path: GLOO WALL TAPPER APP/gradle-build.log
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlooWallMacro-APK
          path: GLOO WALL TAPPER APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
